# nginx/nginx.conf — main configuration. Part 29 §29.7.3 and §29.8.1–29.8.2.
# Mounted read-only at /etc/nginx/nginx.conf by the prod and staging overlays.
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The request id minted by the browser (Part 19) or, absent that, by nginx.
    # It is what makes one request greppable across nginx, Next.js and Django.
    map $http_x_request_id $ub_request_id {
        default   $http_x_request_id;
        ""        $request_id;
    }

    # Part 27 §27.14 — secrets never reach a log line, nginx's included. Two
    # paths carry a credential as a segment: the customer's share link
    # (/d/<token>, /api/v1/public/d/<token>) and the invitation accept
    # (/api/v1/invitations/<token>/accept). The referrer is logged without its
    # query string, because a same-origin Referer from the reset page carries
    # the reset token in `?token=`. Django's access log scrubs the same paths
    # (`apps.common.logging`); this is nginx's copy of the rule.
    map $uri $ub_log_path {
        # The optional `/logo` is the share page's letterhead image, fetched
        # under the same token (/api/v1/public/d/<token>/logo).
        ~^(?<pre>.*/d/)[^/]+(?<post>/logo)?$        "${pre}[redacted]${post}";
        ~^(?<pre>.*/invitations/)[^/]+(?<post>/accept)$ "${pre}[redacted]${post}";
        default                                    $uri;
    }
    map $http_referer $ub_log_referrer {
        ~^(?<pre>[^?#]*/d/)[^/?#]+                  "${pre}[redacted]";
        ~^(?<ref>[^?#]*)                            $ref;
        default                                    "";
    }

    log_format json escape=json '{'
        '"ts":"$time_iso8601",'
        '"request_id":"$ub_request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$ub_log_path",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time",'
        '"host":"$host",'
        '"referrer":"$ub_log_referrer",'
        '"ua":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 12m;          # UB_MEDIA_MAX_UPLOAD_MB + headroom

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json text/css application/javascript image/svg+xml
               text/plain text/xml application/xml font/woff2;

    # ── TLS (§29.8.1) ────────────────────────────────────────────────────────
    # Mozilla "intermediate" cipher list, reviewed 2026-09. Review annually.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  127.0.0.11 valid=30s ipv6=off;   # the compose DNS
    resolver_timeout          5s;

    # ── Rate limiting (§29.7.3, Part 22 §22.1) ───────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;
    limit_req_zone $binary_remote_addr zone=otp:10m  rate=1r/s;
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
