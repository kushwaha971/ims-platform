# nginx/conf.d/app.conf — Part 29 §29.7.3, with §29.8.1's redirect and §29.8.2's
# response headers written out in full.
#
# The important rule in this file is the `internal` + X-Accel-Redirect pattern on
# /media/: NO UPLOADED FILE IS EVER REACHABLE WITHOUT DJANGO DECIDING IT SHOULD
# BE. A merchant's bill photo is not a guessable URL. Public document pages work
# because Django validates the share token and THEN emits the redirect.

upstream ub_backend  { server backend:8000;  keepalive 16; }
upstream ub_frontend { server frontend:3000; keepalive 16; }

# ── Port 80: ACME challenge, then unconditional redirect to HTTPS (§29.8.1) ──
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;            # the only unauthenticated path served from disk
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yourkhata.com www.yourkhata.com;   # partner hosts appended by ops (Part 24 §24.5.2)

    ssl_certificate     /etc/letsencrypt/live/$ssl_server_name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/$ssl_server_name/privkey.pem;

    client_max_body_size 12m;          # UB_MEDIA_MAX_UPLOAD_MB + headroom

    # ── Response headers, set once and asserted by a deploy smoke check (§29.8.2)
    # In security-headers.inc, not inline, because of nginx's inheritance rule:
    # a location with ANY add_header of its own inherits NONE from the server.
    # /static/, /media/ and /_next/static/ each add a Cache-Control, so until
    # Sprint 12 every asset was served without HSTS, nosniff or the CSP. Each of
    # those locations now includes the file again.
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static: hashed by ManifestStaticFilesStorage, therefore immutable.
    location /static/ {
        alias /srv/static/;
        expires 1y; add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Media: authenticated by the app. nginx serves the bytes only after Django
    # authorises the request via X-Accel-Redirect; direct /media/ is never public.
    location /media/ {
        internal;
        alias /srv/media/;
        add_header Cache-Control "private, max-age=86400";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # CR-2026-09-29-PLATFORM-C — the landing page's recordings and posters, and
    # the brand files (favicon SVG, the link-preview card). Both are PUBLIC files
    # the FRONTEND serves from `public/`. The landing block is not optional:
    # `/media/` above is Django's `internal` X-Accel location, and without a
    # longer prefix here every landing loop and poster answered 404 in
    # production — the page worked on every topology except this one.
    #
    # The cache value matches next.config.js exactly (so every topology caches
    # alike) and is deliberately not `immutable`: the file names are not hashed
    # and the clips are re-cut under the same names. A day fresh, a week served
    # stale while revalidating. Next's own header is hidden so there is one.
    location /media/landing/ {
        proxy_pass http://ub_frontend;
        include /etc/nginx/proxy_params;
        proxy_hide_header Cache-Control;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        access_log off;
    }

    location /brand/ {
        proxy_pass http://ub_frontend;
        include /etc/nginx/proxy_params;
        proxy_hide_header Cache-Control;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
        access_log off;
    }

    # The customer's share page, /d/<token> (SAL-03 FR-5, Part 27 §27.12). It is
    # a FRONTEND route — `app/(public)/d/[token]` — and was proxied to the
    # BACKEND here, which has no /d/ route (its API is /api/v1/public/d/<token>):
    # every shared link would have been Django's 404 in production. The token is
    # the credential, so the page is never indexed, never cached, and never
    # sends its URL onward in a Referer. Next's own values for these headers are
    # hidden so the response carries exactly one of each.
    location /d/ {
        proxy_pass http://ub_frontend;
        include /etc/nginx/proxy_params;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Robots-Tag;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-store" always;
    }

    # Super-admin surface. The allowlist include is generated by ops from
    # SUPERADMIN_IP_ALLOWLIST; `deny all` after it is what makes an empty
    # allowlist fail closed. This block precedes /api/ because a longer prefix
    # wins in nginx regardless of order — stated so nobody "fixes" the order.
    location /api/v1/admin/ {
        include /etc/nginx/conf.d/superadmin-allowlist.inc;
        deny all;
        proxy_pass http://ub_backend;
        include /etc/nginx/proxy_params;
    }

    # OTP request/verify: a tighter bucket than the rest of the API.
    location ~ ^/api/v1/auth/otp/ {
        limit_req zone=otp burst=5 nodelay;
        proxy_pass http://ub_backend;
        include /etc/nginx/proxy_params;
    }

    location /api/ {
        proxy_pass http://ub_backend;
        include /etc/nginx/proxy_params;
        proxy_read_timeout 70s;               # > GUNICORN_TIMEOUT
        limit_req zone=api burst=40 nodelay;
    }

    # Next.js build output: hashed, so cacheable for a year.
    location /_next/static/ {
        proxy_pass http://ub_frontend;
        include /etc/nginx/proxy_params;
        expires 1y; add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location / {
        proxy_pass http://ub_frontend;
        include /etc/nginx/proxy_params;
    }
}
