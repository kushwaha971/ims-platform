# flake8 has no pyproject support; ADR-021 lists flake8, so its config lives here
# and mirrors the rules of Part 26 §26.14 that flake8 can express — including that
# chapter's per-file ignores ("config/settings/* = F403, F405 — star-import of base
# is the documented pattern").
[flake8]
max-line-length = 100
extend-ignore = E501,W503,E203
exclude = .git,__pycache__,*/migrations/*,.venv,node_modules
per-file-ignores =
    config/settings/*:F403,F405,E402
    conftest.py:F401,F403,E402
    config/settings/staging.py:F401,F403,F405
    tests/conftest.py:F401,F403
    apps/*/models/__init__.py:F401
