<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YourKhata Mobile Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens. Colours are YourKhata's existing light.css / dark.css values; the
      mobile layer adds only type, spacing and size tokens (see 04-design-system.md). */
:root{
  --primary:#4A47D6; --primary-600:#3A36B8; --primary-50:#F1F0FE; --primary-100:#E1E0FC;
  --canvas:#FFFFFF; --card:#FFFFFF; --sunken:#F1F1F1; --subtle:#FAFAFA; --hover:#F5F5F5;
  --hairline:#E6E6E6; --border:#DCDCDE;
  --text:#0A090B; --text-2:#4F4D55; --text-3:#6B696F; --text-accent:#3A36B8; --on-fill:#FFFFFF;
  --get:#CC1C1C; --get-dim:#FEF1F1; --give:#2B7443; --give-dim:#E8F6ED;
  --warn:#955F0B; --warn-dim:#FFF0D8; --info:#245FE0; --info-dim:#E9F0FF;
  --scrim:rgba(8,10,12,.48); --shadow-2:0 4px 6px -4px rgba(19,25,39,.12),0 8px 8px -4px rgba(19,25,39,.08);
  --shadow-3:0 8px 24px rgba(0,0,0,.14); --shadow-4:0 -8px 32px rgba(0,0,0,.18);
  --seat-free:#E8F6ED; --seat-free-b:#2B7443; --seat-busy:#E1E0FC; --seat-busy-b:#3A36B8; --seat-res:#FFF0D8; --seat-res-b:#955F0B;
  /* mobile layer */
  --m-gutter:16px; --m-bar:56px; --m-nav:64px; --m-target:48px; --m-row:64px;
  --r-card:12px; --r-control:10px; --r-sheet:20px; --r-pill:999px;
  --font:"DM Sans","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --num:"Inter",system-ui,sans-serif;
  --stage:#ECEBF3;
}
:root[data-theme="dark"]{
  --canvas:#0F0E13; --card:#17161C; --sunken:#1F1E25; --subtle:#1A1920; --hover:#22212A;
  --hairline:#2A2930; --border:#36353D; --text:#F4F4F6; --text-2:#C9C7CF; --text-3:#A3A1AA; --text-accent:#B6B3F5;
  --primary-50:#24223F; --primary-100:#2D2B52;
  --get:#F2706A; --get-dim:#3A1D1D; --give:#5BC985; --give-dim:#18301F; --warn:#E9B04B; --warn-dim:#3A2C12; --info:#7FA7FF; --info-dim:#1A2540;
  --seat-free:#18301F; --seat-free-b:#5BC985; --seat-busy:#2D2B52; --seat-busy-b:#B6B3F5; --seat-res:#3A2C12; --seat-res-b:#E9B04B;
  --stage:#07070A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--stage);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.sm{width:20px;height:20px} svg.i.xs{width:16px;height:16px}

/* ── Stage: the prototype in a phone on a wide screen, full-bleed on a phone */
.stage{display:grid;grid-template-columns:280px 390px 340px;gap:32px;justify-content:center;align-items:start;padding:28px 16px;min-height:100%}
.panel{background:var(--card);border:1px solid var(--hairline);border-radius:16px;padding:18px;font-size:14px;line-height:1.5;position:sticky;top:28px;max-height:calc(100vh - 56px);overflow:auto}
.panel h2{font-size:15px;margin:0 0 4px} .panel h3{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--text-3);margin:18px 0 8px;font-weight:600}
.panel p{margin:0 0 8px;color:var(--text-2)} .panel ul{margin:0;padding-left:18px;color:var(--text-2)} .panel li{margin:0 0 8px}
.seg-ctl{display:flex;flex-wrap:wrap;gap:6px}
.seg-ctl button{border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:13px}
.seg-ctl button[aria-pressed="true"]{background:var(--text);color:var(--canvas);border-color:var(--text)}
.jump{display:grid;gap:2px} .jump button{text-align:left;padding:6px 8px;border-radius:8px;font-size:13px;color:var(--text-2)} .jump button:hover{background:var(--hover)}
.phone{width:390px;height:844px;border-radius:48px;background:#15141A;padding:12px;box-shadow:0 30px 60px rgba(20,18,40,.25)}
.screen-wrap{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--canvas);isolation:isolate}
.statusbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font:600 15px var(--num);color:var(--text);background:var(--canvas);position:relative;z-index:6}
@media (max-width:1100px){.stage{grid-template-columns:390px 340px}.panel.left{display:none}}
@media (max-width:780px){.stage{display:block;padding:0}.panel{display:none}.phone{width:100%;height:100dvh;border-radius:0;padding:0;box-shadow:none}.screen-wrap{border-radius:0}.statusbar{display:none}}

/* ── App frame */
#app{position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column}
@media (max-width:780px){#app{inset:0}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--canvas)}
.scr.push{animation:push .26s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateX(28%);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.scr.push,.sheet.enter,.scrim.enter{animation:none!important}}
.bar{height:var(--m-bar);flex:none;display:flex;align-items:center;gap:4px;padding:0 4px 0 8px;background:var(--canvas);border-bottom:1px solid transparent;transition:border-color .15s}
.bar.raised{border-bottom-color:var(--hairline)}
.bar .title{flex:1;min-width:0;font-weight:600;font-size:18px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.icon-btn{width:48px;height:48px;display:grid;place-items:center;border-radius:999px;color:var(--text-2);position:relative}
.icon-btn:active{background:var(--hover)}
.icon-btn .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--get);border:2px solid var(--canvas)}
.biz{display:flex;align-items:center;gap:10px;min-width:0;flex:1;height:48px;padding:0 8px;border-radius:12px;text-align:left}
.biz:active{background:var(--hover)}
.biz .mk{width:32px;height:32px;border-radius:9px;background:var(--primary-600);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
.biz .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px}
.biz .sub{font-size:12px;color:var(--text-3);line-height:16px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:calc(var(--m-nav) + 96px)}
.content.no-nav{padding-bottom:120px}
.content.with-dock{padding-bottom:150px}
.pad{padding:0 var(--m-gutter)}
.h1{font-size:28px;line-height:34px;font-weight:600;margin:4px 0 0;letter-spacing:-.01em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:24px var(--m-gutter) 8px}
.sec h3{margin:0;font-size:16px;font-weight:600}
.sec .meta{font-size:13px;color:var(--text-3)}
.link{color:var(--text-accent);font-weight:500;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
.num{font-family:var(--num);font-feature-settings:"tnum" 1;letter-spacing:-.01em}
.get{color:var(--get)} .give{color:var(--give)} .muted{color:var(--text-3)}

/* ── Bottom navigation */
.nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--m-nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--hairline);z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:500;color:var(--text-3);position:relative}
.nav button .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .15s}
.nav button[aria-current="page"]{color:var(--text)} .nav button[aria-current="page"] .pill{background:var(--primary-100);color:var(--primary-600)}
:root[data-theme="dark"] .nav button[aria-current="page"] .pill{color:var(--text-accent)}
.nav .badge{position:absolute;top:6px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--get);color:#fff;font:600 11px/18px var(--num)}

/* ── FAB (extended, shrinks on scroll) */
.fab{position:absolute;right:16px;bottom:calc(var(--m-nav) + 16px);height:56px;padding:0 20px 0 16px;border-radius:16px;background:var(--primary);color:#fff;display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;box-shadow:var(--shadow-3);z-index:3;transition:padding .2s,width .2s}
.fab.compact{padding:0 16px} .fab.compact span{display:none}
.fab:active{background:var(--primary-600)}

/* ── Cards, rows, chips */
.card{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-card)}
.hero{margin:12px var(--m-gutter) 0;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero .lbl{font-size:13px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.hero .val{font-size:24px;font-weight:600;line-height:30px;margin-top:2px}
.hero > button{text-align:left;padding:4px;border-radius:8px}
.hero > button + button{border-left:1px solid var(--hairline);padding-left:16px;border-radius:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding:12px var(--m-gutter) 4px;scrollbar-width:none} .strip::-webkit-scrollbar{display:none}
.mini{flex:none;min-width:132px;padding:12px;border-radius:12px;background:var(--subtle);border:1px solid var(--hairline)}
.mini .lbl{font-size:12px;color:var(--text-3)} .mini .val{font-size:17px;font-weight:600;margin-top:2px}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 var(--m-gutter)}
.qa button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 2px;border-radius:12px;font-size:12.5px;font-weight:500;line-height:16px;text-align:center}
.qa button:active{background:var(--hover)}
.qa .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--primary-50);color:var(--primary-600)}
:root[data-theme="dark"] .qa .ic{color:var(--text-accent)}
.list{background:var(--card)}
.row{display:flex;align-items:center;gap:12px;min-height:var(--m-row);padding:10px var(--m-gutter);width:100%;text-align:left;position:relative}
.row:active{background:var(--hover)}
.row + .row::before{content:"";position:absolute;top:0;left:68px;right:0;border-top:1px solid var(--hairline)}
.row.plain + .row.plain::before{left:var(--m-gutter)}
.av{width:40px;height:40px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:14px;font-weight:600;color:var(--text-2);flex:none}
.av.ic{border-radius:12px}
.row .main{flex:1;min-width:0}
.row .t{font-size:16px;line-height:22px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:13px;line-height:18px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .end{text-align:right;flex:none}
.row .amt{font-size:16px;font-weight:600;line-height:22px}
.row .amt-l{font-size:12px;color:var(--text-3);line-height:16px}
.row .chev{color:var(--text-3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px var(--m-gutter) 8px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--text-2);background:var(--card);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);border-color:var(--text);color:var(--canvas)}
.chip.rm{background:var(--primary-50);border-color:transparent;color:var(--primary-600)}
:root[data-theme="dark"] .chip.rm{color:var(--text-accent)}
.chip .n{font-family:var(--num);font-size:12px;opacity:.75}
.badge-s{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunken);color:var(--text-2)}
.badge-s.get{background:var(--get-dim);color:var(--get)} .badge-s.give{background:var(--give-dim);color:var(--give)} .badge-s.warn{background:var(--warn-dim);color:var(--warn)} .badge-s.info{background:var(--info-dim);color:var(--info)}
.search{display:flex;align-items:center;gap:8px;height:48px;margin:8px var(--m-gutter);padding:0 6px 0 14px;border-radius:12px;background:var(--sunken);color:var(--text-3)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;color:var(--text);outline:none;height:100%}
.search .fbtn{height:36px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:6px;color:var(--text-2);font-size:14px;font-weight:500;background:var(--card);border:1px solid var(--hairline)}
.search .fbtn .cnt{min-width:18px;height:18px;border-radius:9px;background:var(--primary);color:#fff;font:600 11px/18px var(--num);text-align:center}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunken);border-radius:12px;padding:4px;margin:8px var(--m-gutter) 0;gap:4px}
.seg button{height:40px;border-radius:9px;font-weight:500;font-size:15px;color:var(--text-2)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.band{padding:8px var(--m-gutter);font-size:13px;font-weight:500;color:var(--text-3);background:var(--subtle);border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);position:sticky;top:0;z-index:1}
.summary-line{margin:12px var(--m-gutter) 0;font-size:14px;color:var(--text-3)}
.summary-line b{font-weight:600;color:var(--text)}

/* ── Buttons */
.btn{height:48px;border-radius:12px;padding:0 18px;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent}
.btn.primary{background:var(--primary);color:#fff} .btn.primary:active{background:var(--primary-600)}
.btn.secondary{background:var(--card);border-color:var(--border);color:var(--text)}
.btn.tonal{background:var(--primary-50);color:var(--primary-600)}
:root[data-theme="dark"] .btn.tonal{color:var(--text-accent)}
.btn.danger{background:var(--get);color:#fff}
.btn.gave{background:var(--get);color:#fff} .btn.got{background:var(--give);color:#fff}
:root[data-theme="dark"] .btn.gave{background:#B42318} :root[data-theme="dark"] .btn.got{background:#1F7A45}
.btn.ghost{color:var(--text-accent);padding:0 12px}
.btn.block{width:100%} .btn[disabled]{opacity:.45;pointer-events:none}
.btn .spin{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dock{position:absolute;left:0;right:0;bottom:0;padding:12px var(--m-gutter) calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--hairline);display:flex;gap:12px;z-index:3}
.dock.over-nav{bottom:var(--m-nav)}
.dock .btn{flex:1}
.pillbtns{display:flex;gap:8px;padding:12px var(--m-gutter) 0;overflow-x:auto;scrollbar-width:none}
.pillbtns button{flex:none;height:40px;padding:0 14px;border-radius:999px;background:var(--sunken);display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--text)}

/* ── Forms */
.field{margin:0 var(--m-gutter) 20px}
.field label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
.field .opt{color:var(--text-3);font-weight:400}
.input{width:100%;height:52px;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 14px;font-size:16px;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-100)}
.input.err{border-color:var(--get);border-width:2px}
.ferr{display:flex;gap:6px;align-items:center;color:var(--get);font-size:13px;margin-top:6px}
.hint{color:var(--text-3);font-size:13px;margin-top:6px}
.amount{display:flex;align-items:center;justify-content:center;gap:4px;padding:20px 16px 8px}
.amount .cur{font-size:32px;font-weight:600;color:var(--text-3)}
.amount input{width:100%;max-width:260px;border:0;outline:none;background:transparent;font:600 44px/1.1 var(--num);text-align:left;color:var(--text);caret-color:var(--primary)}
.amount input::placeholder{color:var(--text-3);opacity:.5}
.amount-wrap{border-bottom:2px solid var(--hairline);margin:0 var(--m-gutter) 4px}
.amount-wrap.err{border-color:var(--get)}
.disclosure{margin:0 var(--m-gutter);border-radius:12px;border:1px solid var(--hairline)}
.disclosure > button{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;text-align:left;min-height:56px}
.disclosure .sum{font-size:13px;color:var(--text-3)}
.stepper{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;height:40px}
.stepper button{width:40px;height:40px;display:grid;place-items:center;color:var(--text-2)}
.stepper span{min-width:28px;text-align:center;font:600 15px var(--num)}
.line{display:flex;gap:12px;align-items:center;padding:12px var(--m-gutter)}
.line + .line{border-top:1px solid var(--hairline)}

/* ── Sheets, dialogs, snackbar */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:10}
.scrim.enter{animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;background:var(--card);border-radius:var(--r-sheet) var(--r-sheet) 0 0;z-index:11;display:flex;flex-direction:column;box-shadow:var(--shadow-4);touch-action:none}
.sheet.enter{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(100%)}}
.sheet.full{top:0;max-height:none;border-radius:0}
.grab{height:24px;display:grid;place-items:center;flex:none;cursor:grab}
.grab::after{content:"";width:36px;height:4px;border-radius:2px;background:var(--border)}
.sh-head{display:flex;align-items:center;gap:8px;padding:0 8px 8px var(--m-gutter);flex:none}
.sh-head h2{flex:1;margin:0;font-size:18px;font-weight:600;line-height:24px}
.sh-body{overflow-y:auto;flex:1;padding-bottom:8px;touch-action:pan-y}
.sh-foot{display:flex;gap:12px;padding:12px var(--m-gutter) calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--hairline);flex:none}
.sh-foot .btn{flex:1}
.mrow{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 var(--m-gutter);text-align:left;font-size:16px}
.mrow:active{background:var(--hover)} .mrow .sub{font-size:13px;color:var(--text-3)}
.mrow.danger{color:var(--get)}
.mrow svg{color:var(--text-2)} .mrow.danger svg{color:var(--get)}
.dialog{position:absolute;left:24px;right:24px;top:50%;transform:translateY(-50%);background:var(--card);border-radius:20px;z-index:11;padding:24px 20px 16px;box-shadow:var(--shadow-3)}
.dialog h2{margin:0 0 8px;font-size:20px;line-height:26px}
.dialog p{margin:0 0 20px;color:var(--text-2);font-size:15px;line-height:22px}
.dialog .acts{display:flex;flex-direction:column;gap:8px}
.snack{position:absolute;left:12px;right:12px;bottom:calc(var(--m-nav) + 12px);background:#1E1D24;color:#fff;border-radius:12px;padding:12px 8px 12px 16px;display:flex;align-items:center;gap:12px;font-size:14px;line-height:20px;z-index:20;box-shadow:var(--shadow-3);animation:up .2s}
.snack.no-nav{bottom:96px}
.snack .act{color:#B6B3F5;font-weight:600;padding:8px 12px;border-radius:8px}
.offline{background:var(--warn-dim);color:var(--warn);font-size:13px;padding:8px var(--m-gutter);display:flex;gap:8px;align-items:center;flex:none}

/* ── States */
.sk{background:linear-gradient(90deg,var(--sunken),var(--hover),var(--sunken));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:48px 32px}
.empty .ill{width:72px;height:72px;border-radius:24px;background:var(--primary-50);color:var(--primary-600);display:grid;place-items:center;margin:0 auto 16px}
.empty h3{margin:0 0 6px;font-size:18px} .empty p{margin:0 0 20px;color:var(--text-3);font-size:15px;line-height:22px}
.empty .acts{display:flex;flex-direction:column;gap:8px;max-width:260px;margin:0 auto}
.errbox{margin:16px var(--m-gutter);padding:16px;border-radius:12px;background:var(--get-dim);color:var(--text);display:flex;gap:12px}
.errbox svg{color:var(--get)}
.errbox p{margin:2px 0 10px;color:var(--text-2);font-size:14px}
.success{text-align:center;padding:40px 24px 8px}
.success .tick{width:80px;height:80px;border-radius:50%;background:var(--give-dim);color:var(--give);display:grid;place-items:center;margin:0 auto 16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.flash{animation:flash 1.6s}
@keyframes flash{0%,40%{background:var(--primary-50)}}

/* ── Khata */
.kh-head{padding:4px var(--m-gutter) 0}
.kh-id{display:flex;align-items:center;gap:12px}
.kh-bal{margin-top:16px;padding:16px;border-radius:16px;background:var(--subtle);border:1px solid var(--hairline)}
.kh-bal .big{font-size:34px;font-weight:600;line-height:40px}
.kh-bal .cap{font-size:14px;color:var(--text-2);margin-top:2px}
.credit{height:6px;border-radius:3px;background:var(--sunken);margin-top:12px;overflow:hidden} .credit i{display:block;height:100%;background:var(--warn)}
.ent{display:flex;gap:12px;padding:12px var(--m-gutter);width:100%;text-align:left;align-items:flex-start;position:relative}
.ent:active{background:var(--hover)}
.ent + .ent::before{content:"";position:absolute;top:0;left:var(--m-gutter);right:0;border-top:1px solid var(--hairline)}
.ent .t{font-size:16px;line-height:22px;font-weight:500;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ent .s{font-size:13px;color:var(--text-3);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ent .end{margin-left:auto;text-align:right;flex:none}
.ent .amt{font-size:16px;font-weight:600}

/* ── Seats */
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:8px var(--m-gutter)}
.seat{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font:600 13px var(--num);border:1.5px solid}
.seat.free{background:var(--seat-free);border-color:var(--seat-free-b);color:var(--seat-free-b)}
.seat.busy{background:var(--seat-busy);border-color:var(--seat-busy-b);color:var(--seat-busy-b)}
.seat.res{background:var(--seat-res);border-color:var(--seat-res-b);color:var(--seat-res-b);border-style:dashed}
.legend{display:flex;gap:16px;padding:4px var(--m-gutter) 8px;font-size:13px;color:var(--text-2)}
.legend span{display:flex;align-items:center;gap:6px} .legend i{width:12px;height:12px;border-radius:4px;border:1.5px solid}
.spark{display:block;width:100%;height:56px}
.r{font-family:var(--num)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

function partyList(){
  let ps=D.parties.filter(p=>p.type===S.seg);
  const q=S.q.trim().toLowerCase();
  if(q)ps=ps.filter(p=>p.name.toLowerCase().includes(q)||p.mobile.replace(/\s/g,'').includes(q));
  const f=S.filters;
  if(f.bal==='get')ps=ps.filter(p=>bal(p)>0); if(f.bal==='give')ps=ps.filter(p=>bal(p)<0); if(f.bal==='settled')ps=ps.filter(p=>bal(p)===0);
  if(f.tags.length)ps=ps.filter(p=>p.tags.some(t=>f.tags.includes(t)));
  if(f.sort==='high')ps=[...ps].sort((a,b)=>Math.abs(bal(b))-Math.abs(bal(a)));
  if(f.sort==='name')ps=[...ps].sort((a,b)=>a.name.localeCompare(b.name));
  return ps;
}
const activeFilterCount=()=>{const f=S.filters;return (f.show!=='active')+(f.bal!=='all')+f.tags.length+(f.sort!=='recent')};
function partyRows(){
  if(S.mode==='loading')return skRows(6);
  if(S.mode==='error')return errBox('parties');

  if(S.mode==='empty'&&!S.q)return `<div class="empty"><div class="ill">${ic('users')}</div><h3>No ${word}s yet</h3><p>Add the people you give credit to. Their balance stays up to date as you write entries.</p><div class="acts"><button class="btn primary" data-a="go" data-v="addParty">${ic('plus','sm')}Add ${word}</button><button class="btn secondary" data-a="toast" data-v="Import from a CSV, the existing import flow.">${ic('upload','sm')}Import a list</button></div></div>`;

}

const app=document.getElementById('app');
let lastKey='',scrollMem={};
function render(){
  const c=cur();const key=c.r+(c.id||'');
  const sc=app.querySelector('.content');if(sc)scrollMem[lastKey]=sc.scrollTop;
  let html=`<div class="scr ${S.justPushed?'push':''}">${R[c.r](c)}</div>`;
  if(S.sheet){const [n,...args]=S.sheet.split(':');html+=n==='entry'&&args.length?SH.entryDetail(args[0]):n==='seat'?SH.seat(args[0],args[1]):SH[n==='entryNew'?'entry':n]()}
  if(S.dialog){const [t,b,a]=DLG[S.dialog]();html+=`<div class="scrim enter" data-a="closeDialog"></div><div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlgt"><h2 id="dlgt">${t}</h2><p>${b}</p><div class="acts">${a}</div></div>`}
  if(S.snack)html+=`<div class="snack ${hasNav()?'':'no-nav'}" role="status"><span style="flex:1">${S.snack.t}</span>${S.snack.a?`<button class="act" data-a="${S.snack.a}">${S.snack.l}</button>`:''}</div>`;
  app.innerHTML=html;
  const nsc=app.querySelector('.content');if(nsc&&key===lastKey&&!S.justPushed)nsc.scrollTop=scrollMem[key]||0;
  lastKey=key;S.justPushed=false;S.sheetNew=false;
  wrapRupee(app);bindScroll();controls();notes();
  const fi=app.querySelector('#eamt');if(fi&&S.focusAmt){fi.focus();S.focusAmt=false}
}
const hasNav=()=>!S.stack.length;
/* DM Sans draws ₹ oddly; the app sets the rupee sign in Inter everywhere (DESIGN-SYSTEM §2). */
function wrapRupee(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];while(w.nextNode()){const n=w.currentNode;if(n.nodeValue.includes('₹')&&!n.parentElement.closest('.num,.r'))hits.push(n)}for(const n of hits){const f=document.createDocumentFragment();n.nodeValue.split(/(₹)/).forEach(part=>{if(part==='₹'){const s=document.createElement('span');s.className='r';s.textContent='₹';f.appendChild(s)}else if(part)f.appendChild(document.createTextNode(part))});n.replaceWith(f)}}
function bindScroll(){const sc=app.querySelector('.content');const bar=app.querySelector('.bar');const f=app.querySelector('.fab');if(!sc)return;let last=sc.scrollTop;sc.onscroll=()=>{bar&&bar.classList.toggle('raised',sc.scrollTop>4);if(f){if(sc.scrollTop>last+4)f.classList.add('compact');else if(sc.scrollTop<last-4)f.classList.remove('compact')}last=sc.scrollTop}}
let snackT;
function toast(t,a,l){S.snack={t,a,l};clearTimeout(snackT);snackT=setTimeout(()=>{S.snack=null;render()},a?6000:3200)}
function push(r,id){S.stack.push({r,id});S.justPushed=true;S.sheet=null;S.dialog=null}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=t.dataset.a,v=t.dataset.v,id=t.dataset.id;
  const A={
    tab:()=>{S.tab=v;S.stack=[];S.sheet=null;S.justPushed=false},
    go:()=>{if(v==='statement'&&!id){push('statement',cur().id)}else push(v,id?(isNaN(+id)?id:+id):undefined);if(v==='addParty')S.newParty=null},
    back:()=>{const c=cur();if(c.r==='newBill'&&S.draft.lines.length){S.dialog='discard';return}S.stack.pop()},
    forceBack:()=>{S.dialog=null;S.stack.pop()},
    draftExit:()=>{S.dialog=null;S.stack.pop();toast('Saved as a draft in Bills.')},
    sheet:()=>{S.sheet=v;S.sheetNew=true;S.dialog=null},
    closeSheet:()=>{S.sheet=null},
    dialog:()=>{S.dialog=v;S.sheet=null},

    setF:()=>{const [k,val]=v.split(':');if(k==='tags'){const i=S.filters.tags.indexOf(val);i<0?S.filters.tags.push(val):S.filters.tags.splice(i,1)}else S.filters[k]=val},
    rmFilter:()=>{if(v.startsWith('tag:'))S.filters.tags=S.filters.tags.filter(x=>x!==v.slice(4));else S.filters[v]=v==='sort'?'recent':'all'},
    clearFilters:()=>{S.filters={show:'active',bal:'all',sort:'recent',tags:[]};S.q='';S.sheet=null},
    billStatus:()=>{S.billStatus=v},
    billKind:()=>{S.billKind=v;S.billStatus='all';S.sheet=null},
    itemChip:()=>{S.itemChip=v},
    itemsLow:()=>{S.tab='items';S.stack=[];S.itemChip='low'},
    entry:()=>{S.entry={pid:cur().id,dir:v,amt:'',note:'',date:'Today',err:null};S.sheet='entryNew';S.sheetNew=true;S.focusAmt=true},
    pickParty:()=>{S.sheet=null;push('khata',+v);S.entry={pid:+v,dir:'gave',amt:'',note:'',date:'Today',err:null};S.sheet='entryNew';S.sheetNew=true;S.focusAmt=true},
    eDir:()=>{readEntry();S.entry.dir=v},
    eDate:()=>{readEntry();S.entry.date=v},
    saveEntry:()=>{readEntry();const n=parseFloat(S.entry.amt);if(!S.entry.amt||!(n>0)){S.entry.err='Enter an amount more than ₹0.';S.focusAmt=true;return}
      const p=D.parties.find(x=>x.id===S.entry.pid);
      if(S.entry.dir==='gave'&&p.limit&&bal(p)+n>p.limit){S.entry.err=`That crosses ${p.name}'s ${inr(p.limit,false)} credit limit. Only the owner can go past it.`;return}
      S.busy=true;render();setTimeout(()=>{S.busy=false;const ne={id:++uid,date:S.entry.date,dir:S.entry.dir,amt:n,note:S.entry.note||(S.entry.dir==='gave'?'Goods or cash given':'Payment received')};p.entries.unshift(ne);S.flashId=ne.id;S.sheet=null;
        toast(`${inr(n,false)} ${S.entry.dir==='gave'?'given to':'received from'} ${p.name}. Balance ${inr(bal(p),false)}.`,'undoEntry','Undo');S.lastEntry={p,ne};render()},S.mode==='offline'?0:600)},
    undoEntry:()=>{const {p,ne}=S.lastEntry;p.entries=p.entries.filter(x=>x!==ne);S.snack=null;toast('Entry removed.')},
    corr:()=>{S.corrections=!S.corrections;S.sheet=null},
    doReverse:()=>{S.dialog=null;toast('Entry reversed. Both lines stay in the khata.')},
    toggle:()=>{if(v==='npOpen')readParty();S[v]=!S[v]},
    npType:()=>{readParty();S.newParty.type=v},npDir:()=>{readParty();S.newParty.dir=v},
    saveParty:()=>{readParty();const d=S.newParty;d.err={};if(!d.name.trim())d.err.name='Enter a name.';const m=d.mobile.replace(/\D/g,'');if(m&&!/^[6-9]\d{9}$/.test(m.slice(-10)))d.err.mobile='Enter a 10-digit mobile number starting 6–9.';
      if(Object.keys(d.err).length)return;S.busy=true;render();setTimeout(()=>{S.busy=false;const p={id:++uid,name:d.name.trim(),type:d.type,mobile:m?'+91 '+m.slice(-10,-5)+' '+m.slice(-5):'—',last:'Just now',tags:[],entries:d.amt?[{id:++uid,date:'Today',dir:'gave',amt:0,note:'Opening balance',opening:true,ob:(d.dir==='get'?1:-1)*+d.amt}]:[]};D.parties.unshift(p);S.stack.pop();S.q='';
        if(cur().r==='newBill'){S.draft.party=p.name}else{push('khata',p.id)}toast(`${p.name} added.`);render()},600)},
    newBill:()=>{S.draft={who:'walkin',party:null,lines:[],err:null};S.billMore=false;push('newBill')},
    newBillAgain:()=>{S.stack.pop();S.draft={who:'walkin',party:null,lines:[],err:null};push('newBill')},

    billPartySet:()=>{S.draft.party=v;S.sheet=null},
    addLine:()=>{const it=D.items.find(i=>i.id===+v);if(!it.stock){toast(`${it.name} is out of stock.`);return}const l=S.draft.lines.find(x=>x.id===it.id);l?l.qty++:S.draft.lines.push({id:it.id,name:it.name,price:it.price,qty:1});S.draft.err=null},
    qty:()=>{const [i,d]=v.split(':').map(Number);const l=S.draft.lines[i];l.qty+=d;if(l.qty<1)S.draft.lines.splice(i,1)},

    gq:()=>{S.gq=v},
    shift:()=>{S.seatShift=v},
  };
  if(['tab','go','back','switchApp'].includes(a))S.snack=null; // a toast belongs to the screen it reports on
  if(A[a]){e.preventDefault();if(A[a]()!=='skip')render()}
});
function readEntry(){const a=app.querySelector('#eamt'),n=app.querySelector('#enote');if(a)S.entry.amt=a.value.replace(/[^\d.]/g,'');if(n)S.entry.note=n.value;S.entry.err=null}
function readParty(){const d=S.newParty;const g=s=>app.querySelector(s);if(g('#np-name'))d.name=g('#np-name').value;if(g('#np-mob'))d.mobile=g('#np-mob').value;if(g('#np-amt'))d.amt=g('#np-amt').value.replace(/[^\d.]/g,'')}
app.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;document.getElementById('plist').innerHTML=partyRows()}
  if(e.target.id==='gq'){S.gq=e.target.value;const q=S.gq.toLowerCase();document.getElementById('sres').innerHTML=searchBody(q?D.parties.filter(p=>p.name.toLowerCase().includes(q)):[],q?D.bills.filter(b=>(b.party+b.no).toLowerCase().includes(q)):[],q?D.items.filter(i=>i.name.toLowerCase().includes(q)):[],q)}
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='eamt'){e.preventDefault();app.querySelector('[data-a="saveEntry"]')?.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.dialog)S.dialog=null;else if(S.sheet)S.sheet=null;else return;render()}});
/* swipe a sheet down to dismiss (from its grabber or header) */
let drag=null;
app.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-grab], .sh-head');if(!g||e.target.closest('button'))return;const sh=g.closest('.sheet');if(!sh||sh.classList.contains('full'))return;drag={sh,y:e.clientY,dy:0};sh.setPointerCapture(e.pointerId)});
app.addEventListener('pointermove',e=>{if(!drag)return;drag.dy=Math.max(0,e.clientY-drag.y);drag.sh.style.transform=`translateY(${drag.dy}px)`});
app.addEventListener('pointerup',()=>{if(!drag)return;if(drag.dy>90){S.sheet=null;render()}else drag.sh.style.transform='';drag=null});

/* ════════════════════════════════════════════════════════════════════════
   Side panels: controls and design notes
   ════════════════════════════════════════════════════════════════════════ */
function setTheme(t){S.theme=t;document.documentElement.dataset.theme=t}
function btns(el,opts,curv,fn){el.innerHTML=opts.map(([v,l])=>`<button data-ctl="${v}" aria-pressed="${curv===v}">${l}</button>`).join('');el.onclick=e=>{const b=e.target.closest('[data-ctl]');if(b){fn(b.dataset.ctl);render()}}}
function controls(){
  btns(document.getElementById('ctl-app'),[['shop','Shop'],['library','Library']],S.app,v=>{S.app=v;S.tab=v==='library'?'lhome':'home';S.stack=[];S.sheet=null});
  btns(document.getElementById('ctl-mode'),[['normal','Normal'],['loading','Loading'],['empty','Empty'],['error','Error'],['offline','Offline']],S.mode,v=>{S.mode=v});
  btns(document.getElementById('ctl-theme'),[['light','Light'],['dark','Dark']],S.theme,v=>setTheme(v));
  const J=[['Write a khata entry',()=>{S.app='shop';S.tab='parties';S.stack=[];push('khata',1)}],['Make a bill for a walk-in',()=>{S.app='shop';S.tab='bills';S.stack=[];A_newBill()}],['Filter customers',()=>{S.app='shop';S.tab='parties';S.stack=[];S.sheet='filters';S.sheetNew=true}],['Add a party',()=>{S.app='shop';S.tab='parties';S.stack=[];S.newParty=null;push('addParty')}],['Archive with a balance',()=>{S.app='shop';S.stack=[];S.tab='parties';push('khata',1);S.dialog='archive'}],['Find anything',()=>{S.app='shop';S.stack=[];push('search')}],['Every other feature (More)',()=>{S.app='shop';S.tab='more';S.stack=[]}],['Library: seat map',()=>{S.app='library';S.tab='seats';S.stack=[]}]];
  const j=document.getElementById('ctl-jump');j.innerHTML=J.map(([l],i)=>`<button data-j="${i}">→ ${l}</button>`).join('');j.onclick=e=>{const b=e.target.closest('[data-j]');if(b){S.sheet=null;S.dialog=null;J[+b.dataset.j][1]();render()}};
}
function A_newBill(){S.draft={who:'walkin',party:null,lines:[],err:null};S.billMore=false;push('newBill')}
